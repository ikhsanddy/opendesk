---
name: Bug Report
description: Report a bug encountered while using Opendesk
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Opendesk issue tracker! Before creating an issue, please consider the following:

        1. This tracker should only be used to report bugs and request features / enhancements to Opendesk
            - For questions and general support, start a discussion at [GitHub Discussions](https://github.com/ikhsanddy/opendesk/discussions).
            - For documentation issues, open an issue on the [repository](https://github.com/ikhsanddy/opendesk/issues).
        2. When making a bug report, make sure you provide all required information. The easier it is for
           maintainers to reproduce, the faster it'll be fixed.
        3. If you think you know what the reason for the bug is, share it with us. Maybe put in a PR 😉

  - type: textarea
    id: bug-info
    attributes:
      label: Information about bug
      description: Also tell us, what did you expect to happen? If applicable, add screenshots to help explain your problem.
      placeholder: Please provide as much information as possible.
    validations:
      required: true

  - type: textarea
    id: exact-version
    attributes:
      label: Version
      description: Share exact version number of Frappe, and Opendesk you are using.
      placeholder: |
        Frappe version -
        Opendesk version -
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - docker
        - manual install (bench)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / Stack trace / Full Error Message.
      description: Please copy and paste any relevant log output. This will be automatically formatted.
      render: shell

...
